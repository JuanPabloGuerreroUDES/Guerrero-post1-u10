# sonar-project.properties
# Configuración del análisis de SonarQube para envios-service.
# Nota: mvn sonar:sonar toma estos mismos valores de <properties> en pom.xml;
# este archivo es la referencia documentada y el que usa el scanner CLI (sonar-scanner).

# --- Identificación del proyecto en el servidor ---
# Clave única con la que el proyecto se registra en SonarQube (groupId:artifactId)
sonar.projectKey=com.universidad:envios-service
# Nombre visible en el dashboard
sonar.projectName=Envios Service
# Versión del análisis. 1.0 = código original (Parte 1); 2.0 = refactor Strategy (Parte 2).
# Con New Code = "previous version", el refactor se evalúa como código nuevo en el Quality Gate.
sonar.projectVersion=2.0

# --- Código a analizar ---
# Código de producción: sobre él se calculan complejidad, code smells y cobertura
sonar.sources=src/main/java
# Código de pruebas: se analiza aparte y no cuenta para la cobertura
sonar.tests=src/test/java
# Bytecode compilado; el analizador de Java lo necesita para resolver tipos
sonar.java.binaries=target/classes

# --- Cobertura ---
# Reporte XML que JaCoCo genera en la fase verify (mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Exclusiones (Decisión de diseño 2) ---
# No se excluye ninguna clase: el proyecto no tiene clase Main, DTOs ni código generado.
# Todo lo que hay en src/main/java es lógica de negocio y debe medirse.
# sonar.exclusions=

# --- Servidor ---
# SonarQube Community local (sin Docker), en el puerto por defecto
sonar.host.url=http://localhost:9000
# No bloquear el build esperando el resultado del Quality Gate
sonar.qualitygate.wait=false
